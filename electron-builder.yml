# Windows x64 installer only (this fork targets the owner's Windows PC + laptop).
# Based on munder-difflin's electron-builder.yml (MIT, see LICENSE).
#
# NOTE: the upstream `publish:` block (auto-update from the original author's
# GitHub releases) is intentionally removed — a build of this fork must never
# update itself from someone else's releases.
appId: com.son.aioffice
productName: SON AI Office
copyright: Copyright © 2026 SON. Based on munder-difflin, Copyright © 2026 Chaitanya Giri (MIT).

directories:
  output: dist
  buildResources: build

# electron-vite emits the app into out/; package exactly that plus what the
# runtime needs. node-pty is native, so keep it out of the asar.
files:
  - out/**
  - package.json
  - "!**/*.{md,map,ts,tsx}"
  - "!**/{.eslintrc,.prettierrc,tsconfig*.json,electron.vite.config.*}"

extraResources:
  - from: resources/md-slack-reply.cjs
    to: md-slack-reply.cjs
  - from: resources/kg.cjs
    to: kg.cjs
  - from: src/main/kg-core.cjs
    to: kg-core.cjs
  - from: resources/skills
    to: skills
  # API connector runtime (spawned as `node api-agent.cjs --connector <id>`).
  - from: resources/api-agent.cjs
    to: api-agent.cjs
  # LICENSE texts travel with the app (MIT requires the notice; art assets have their own license).
  - from: LICENSE
    to: LICENSE.txt
  - from: LICENSE-ASSETS
    to: LICENSE-ASSETS.txt

asarUnpack:
  - "**/node_modules/node-pty/**"
  - "**/node_modules/better-sqlite3/**"

# Rebuild native deps (node-pty, better-sqlite3) for the target during packaging.
npmRebuild: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: SON-AI-Office-${version}-win-x64-setup.exe
  shortcutName: SON AI Office
